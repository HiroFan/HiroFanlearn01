server:
  servlet:
    context-path: /content
  port: 63040
spring:
  profiles:
    active: dev_1
  application:
    name: content-api
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      discovery:
        namespace: dev_1
        group: learnpro06
      config:
        namespace: dev_1
        group: learnpro06
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: content-service-${spring.profiles.active}.yaml
            group: learnpro06
            refresh: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yaml
            group: learnpro06
            refresh: true
          - data-id: logging-${spring.profiles.active}.yaml
            group: learnpro06
            refresh: true

